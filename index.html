<section class="intro"><p class="eyebrow">✦ &nbsp; 一座可以探索的概念词典</p><h1>从一个问题开始，<br><em>找到理解的路径。</em></h1><p class="lead">选择一个概念，从你熟悉的部分出发，<br>一步步展开它的解释。</p><label for="search">搜索演示概念</label><div class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="试试：茶、雨伞、书签" autocomplete="off"></div><p class="hint">这是使用自编示例的小范围演示，不连接完整词典。</p><div id="results" class="results" aria-live="polite"></div></section>
